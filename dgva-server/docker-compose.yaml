services:
  dgva-server:
    build:
      context: ..
      dockerfile: dgva-server/Dockerfile
    image: dgva-server:local
    ports:
      - "8080:8080"
    volumes:
      - ./local-config/application.properties:/app/config/application.properties:ro
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/dgva/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  oracle:
    image: gvenzl/oracle-free:slim
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle_pass
      - APP_USER=oracle_user
      - APP_USER_PASSWORD=oracle_pass
      - ORACLE_DATABASE=oracle_db
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  oracle_data: